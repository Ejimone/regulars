[project]
name = "regulars-api"
version = "0.1.0"
description = "Regulars API — AI-drafted, knowledge-grounded replies to reviews and DMs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "groq>=0.13",
    "email-validator>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# fastembed drags in onnxruntime + numpy + model weights (~150MB), which blows
# the serverless bundle limit. It is an extra so deployments can skip it and use
# EMBEDDING_PROVIDER=jina, while local work keeps free CPU embeddings.
local-embeddings = [
    "fastembed>=0.4",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "fastembed>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "fastembed.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
